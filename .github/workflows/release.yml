name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Validate
        run: python3 scripts/validate.py && python3 tests/run_fixtures.py
      - name: Package .skill files
        run: python3 scripts/package_skills.py dist
      - name: Release notes from CHANGELOG
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || echo "Release $GITHUB_REF_NAME" > /tmp/notes.md
      - name: Create GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/*.skill dist/*.zip --title "editorial-web-craft $GITHUB_REF_NAME" --notes-file /tmp/notes.md
